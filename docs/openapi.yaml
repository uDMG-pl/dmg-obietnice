openapi: 3.1.0
info:
  title: DMG Obietnice Management API
  version: 1.2.0
  description: |
    A versioned API for managing public promises and submissions. Every endpoint
    requires an API key in the `x-api-key` header. Both resources use the existing
    `promises.read` and `promises.write` permissions and share per-key rate limits.
    Previously issued keys and existing MongoDB documents require no migration.
    API responses are not cached.
servers:
  - url: /
    description: Current application origin
tags:
  - name: Promises
    description: Create, read, update, and permanently delete promises.
  - name: Submissions
    description: Create, read, moderate, and permanently delete submissions.
security:
  - ApiKeyAuth: []
paths:
  /api/v1/promises:
    get:
      tags: [Promises]
      summary: List promises
      description: |
        Returns promises ordered by MongoDB ObjectId in descending order. Use
        the opaque `nextCursor` value from one response as `cursor` in the next
        request. Alternatively, pass `page` for numbered pagination with an
        exact total count. `page` and `cursor` cannot be combined. Pages beyond
        the last page are clamped; an empty collection has page 1 of 1.
        Requires the `promises.read` permission.
      operationId: listPromises
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: A page of promises.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromiseListResponse"
              examples:
                page:
                  value:
                    data:
                      - id: 66a12f15f32e7a58d83b6f19
                        title: Publish the annual report
                        dateDue:
                          year: 2026
                          month: 9
                        status: promised
                        tags: [reports]
                    pagination:
                      limit: 50
                      nextCursor: 66a12f15f32e7a58d83b6f19
                finalPage:
                  value:
                    data: []
                    pagination:
                      limit: 50
                      nextCursor: null
                numberedPage:
                  value:
                    data: []
                    pagination:
                      limit: 25
                      nextCursor: null
                      currentPage: 1
                      totalCount: 0
                      totalPages: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Promises]
      summary: Create a promise
      description: |
        Creates a promise. If omitted, `status` defaults to `promised` and
        `tags` defaults to an empty array. Requires the `promises.write`
        permission.
      operationId: createPromise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromiseCreateRequest"
            example:
              title: Publish the annual report
              description: Make the audited report publicly available.
              url: https://example.com/announcement
              datePromised:
                year: 2025
                month: 11
                day: 4
              dateDue:
                year: 2026
                month: 9
              status: promised
              tags: [reports, transparency]
      responses:
        "201":
          description: Promise created.
          headers:
            Location:
              description: Absolute URL of the created promise.
              schema:
                type: string
                format: uri
              example: http://localhost:3000/api/v1/promises/66a12f15f32e7a58d83b6f19
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromiseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/promises/{id}:
    parameters:
      - $ref: "#/components/parameters/PromiseId"
    get:
      tags: [Promises]
      summary: Get a promise
      description: Returns one promise. Requires the `promises.read` permission.
      operationId: getPromise
      responses:
        "200":
          description: Promise found.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromiseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Promises]
      summary: Update a promise
      description: |
        Applies a partial update and requires at least one field. Set
        `description`, `url`, `datePromised`, `dateDue`, or `notes` to `null`
        to remove it. An empty `tags` array clears all tags. `status` and
        `tags` cannot be `null`. Requires the `promises.write` permission.
      operationId: updatePromise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromisePatchRequest"
            examples:
              markFulfilled:
                value:
                  status: fulfilled
                  notes: null
              clearTags:
                value:
                  tags: []
      responses:
        "200":
          description: Promise updated.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromiseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Promises]
      summary: Delete a promise
      description: |
        Permanently deletes a promise. Requires the `promises.write`
        permission.
      operationId: deletePromise
      responses:
        "204":
          description: Promise deleted. The response has no body.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/submissions:
    get:
      tags: [Submissions]
      summary: List submissions
      description: |
        Reads the existing zgloszenia collection, ordered by descending MongoDB
        ObjectId. Optionally filter by status. Use nextCursor as cursor for the
        next page and preserve the status filter. Alternatively, pass page for
        numbered pagination with exact filtered counts. Page and cursor cannot
        be combined. Pages beyond the last page are clamped; empty results have
        page 1 of 1. Requires the existing promises.read permission.
      operationId: listSubmissions
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/SubmissionStatusFilter"
      responses:
        "200":
          description: A page of submissions.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Submissions]
      summary: Create a submission
      description: |
        Creates a submission in zgloszenia. Status defaults to pending. The server
        assigns id and createdAt. Content uses the same validation as the public
        form. Requires the existing promises.write permission. This trusted API
        uses per-key rate limits and does not require a Turnstile token.
      operationId: createSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionCreateRequest"
            example:
              clipUrl: https://youtu.be/example
              description: A promise to publish the annual report.
      responses:
        "201":
          description: Submission created.
          headers:
            Location:
              description: Absolute URL of the created submission.
              schema:
                type: string
                format: uri
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/submissions/{id}:
    parameters:
      - $ref: "#/components/parameters/SubmissionId"
    get:
      tags: [Submissions]
      summary: Get a submission
      description: Returns one submission. Requires the existing promises.read permission.
      operationId: getSubmission
      responses:
        "200":
          description: Submission found.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Submissions]
      summary: Update a submission
      description: |
        Applies a partial update to status, clipUrl, or description; at least one
        field is required. Fields cannot be null. id and createdAt are read-only.
        Status changes are allowed in either direction. Accepting a submission
        does not create or publish a promise. Requires the existing promises.write
        permission.
      operationId: updateSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionPatchRequest"
            example:
              status: accepted
      responses:
        "200":
          description: Submission updated.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Submissions]
      summary: Delete a submission
      description: Permanently deletes a submission. Requires the existing promises.write permission.
      operationId: deleteSubmission
      responses:
        "204":
          description: Submission deleted. The response has no body.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Existing promise API keys work for both resources, including their read/write scopes.
  headers:
    NoStore:
      description: Management API responses are never cached.
      schema:
        type: string
        const: no-store
      example: no-store
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of resources returned in this page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      example: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque `nextCursor` value from the preceding page. Cannot be combined with `page`.
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{24}$"
      example: 66a12f15f32e7a58d83b6f19
    Page:
      name: page
      in: query
      required: false
      description: One-based page number. Enables exact counts and clamps to the last page. Cannot be combined with `cursor`.
      schema:
        type: integer
        minimum: 1
        maximum: 9007199254740991
      example: 2
    PromiseId:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId of the promise.
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{24}$"
      example: 66a12f15f32e7a58d83b6f19
    SubmissionId:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId of the submission.
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{24}$"
      example: 66a12f15f32e7a58d83b6f19
    SubmissionStatusFilter:
      name: status
      in: query
      required: false
      description: Return only submissions with this status. Omit to return all statuses.
      schema:
        $ref: "#/components/schemas/SubmissionStatus"
  responses:
    BadRequest:
      description: The query, path parameter, JSON, or request body is invalid.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validation:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Request validation failed.
                  details:
                    - path: title
                      code: too_small
                      message: "Too small: expected string to have >=1 characters"
            invalidJson:
              value:
                error:
                  code: INVALID_JSON
                  message: Request body is not valid JSON.
            invalidId:
              value:
                error:
                  code: INVALID_ID
                  message: Promise id must be a 24-character hexadecimal ObjectId.
    Unauthorized:
      description: The API key is missing, invalid, revoked, or expired.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        WWW-Authenticate:
          description: Authentication challenge for the management API.
          schema:
            type: string
            const: 'ApiKey realm="promises-api"'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHORIZED
              message: API key is required.
    Forbidden:
      description: The API key does not have the required permission.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: FORBIDDEN
              message: API key does not have the required permission.
    NotFound:
      description: No resource exists with the supplied ID.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            promise:
              value:
                error:
                  code: NOT_FOUND
                  message: Promise was not found.
            submission:
              value:
                error:
                  code: NOT_FOUND
                  message: Submission was not found.
    UnsupportedMediaType:
      description: The request body is not JSON.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: Content-Type must be application/json.
    TooManyRequests:
      description: The per-key request limit has been exceeded.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          description: Optional number of seconds until another request may be attempted.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: RATE_LIMIT_EXCEEDED
              message: API key rate limit exceeded.
    InternalError:
      description: An unexpected server error occurred.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred.
  schemas:
    SubmissionStatus:
      type: string
      enum: [pending, reviewed, rejected, accepted]
    SubmissionClipUrl:
      type: string
      format: uri
      maxLength: 2048
      description: |
        Trimmed HTTPS clip URL from Twitch, Kick, YouTube, Google Drive, or
        Streamable, using the same validation as the public submission form.
      pattern: '^https://'
    SubmissionDescription:
      type: string
      minLength: 10
      maxLength: 2000
      description: Trimmed description of the promise in the clip.
    Submission:
      type: object
      additionalProperties: false
      required: [id, clipUrl, description, status, createdAt]
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          readOnly: true
        clipUrl:
          $ref: "#/components/schemas/SubmissionClipUrl"
        description:
          $ref: "#/components/schemas/SubmissionDescription"
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Server-assigned creation time, returned as an ISO timestamp.
      example:
        id: 66a12f15f32e7a58d83b6f19
        clipUrl: https://youtu.be/example
        description: A promise to publish the annual report.
        status: pending
        createdAt: '2026-07-11T12:00:00.000Z'
    SubmissionCreateRequest:
      type: object
      additionalProperties: false
      required: [clipUrl, description]
      properties:
        clipUrl:
          $ref: "#/components/schemas/SubmissionClipUrl"
        description:
          $ref: "#/components/schemas/SubmissionDescription"
        status:
          allOf:
            - $ref: "#/components/schemas/SubmissionStatus"
          default: pending
    SubmissionPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        clipUrl:
          $ref: "#/components/schemas/SubmissionClipUrl"
        description:
          $ref: "#/components/schemas/SubmissionDescription"
        status:
          $ref: "#/components/schemas/SubmissionStatus"
    SubmissionResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Submission"
    SubmissionListResponse:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Submission"
        pagination:
          $ref: "#/components/schemas/Pagination"
    PromiseStatus:
      type: string
      enum:
        - promised
        - partially_fulfilled
        - fulfilled
        - fulfilled_late
        - unfulfilled
    PartialDate:
      description: |
        A calendar date with year, month, or day precision. The server validates
        the actual calendar date, including leap years.
      oneOf:
        - $ref: "#/components/schemas/YearDate"
        - $ref: "#/components/schemas/MonthDate"
        - $ref: "#/components/schemas/DayDate"
    YearDate:
      type: object
      additionalProperties: false
      required: [year]
      properties:
        year:
          type: integer
          minimum: 1000
          maximum: 9999
      example:
        year: 2026
    MonthDate:
      type: object
      additionalProperties: false
      required: [year, month]
      properties:
        year:
          type: integer
          minimum: 1000
          maximum: 9999
        month:
          type: integer
          minimum: 1
          maximum: 12
      example:
        year: 2026
        month: 7
    DayDate:
      type: object
      additionalProperties: false
      required: [year, month, day]
      properties:
        year:
          type: integer
          minimum: 1000
          maximum: 9999
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
      example:
        year: 2026
        month: 7
        day: 11
    Promise:
      type: object
      additionalProperties: false
      required: [id, title, status, tags]
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: MongoDB ObjectId represented as a string.
        title:
          type: string
          minLength: 1
        description:
          type: string
        url:
          type: string
          format: uri
        datePromised:
          $ref: "#/components/schemas/PartialDate"
        dateDue:
          $ref: "#/components/schemas/PartialDate"
        notes:
          type: string
        status:
          $ref: "#/components/schemas/PromiseStatus"
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
      example:
        id: 66a12f15f32e7a58d83b6f19
        title: Publish the annual report
        description: Make the audited report publicly available.
        url: https://example.com/announcement
        datePromised:
          year: 2025
          month: 11
          day: 4
        dateDue:
          year: 2026
          month: 9
        status: promised
        tags: [reports, transparency]
    PromiseCreateRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          minLength: 1
          maxLength: 2000
        url:
          type: [string, "null"]
          format: uri
          pattern: "^https://"
          maxLength: 2048
        datePromised:
          anyOf:
            - $ref: "#/components/schemas/PartialDate"
            - type: "null"
        dateDue:
          anyOf:
            - $ref: "#/components/schemas/PartialDate"
            - type: "null"
        notes:
          type: [string, "null"]
          minLength: 1
          maxLength: 2000
        status:
          allOf:
            - $ref: "#/components/schemas/PromiseStatus"
          default: promised
        tags:
          type: array
          default: []
          maxItems: 20
          description: Values are trimmed and duplicates are removed.
          items:
            type: string
            minLength: 1
            maxLength: 64
    PromisePatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          minLength: 1
          maxLength: 2000
        url:
          type: [string, "null"]
          format: uri
          pattern: "^https://"
          maxLength: 2048
        datePromised:
          anyOf:
            - $ref: "#/components/schemas/PartialDate"
            - type: "null"
        dateDue:
          anyOf:
            - $ref: "#/components/schemas/PartialDate"
            - type: "null"
        notes:
          type: [string, "null"]
          minLength: 1
          maxLength: 2000
        status:
          $ref: "#/components/schemas/PromiseStatus"
        tags:
          type: array
          maxItems: 20
          description: Values are trimmed and duplicates are removed.
          items:
            type: string
            minLength: 1
            maxLength: 64
    PromiseResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Promise"
    Pagination:
      type: object
      additionalProperties: false
      required: [limit, nextCursor]
      dependentRequired:
        currentPage: [totalCount, totalPages]
        totalCount: [currentPage, totalPages]
        totalPages: [currentPage, totalCount]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        nextCursor:
          type: [string, "null"]
          pattern: "^[0-9a-fA-F]{24}$"
          description: Opaque cursor for the next page, or `null` on the final page.
        currentPage:
          type: integer
          minimum: 1
          description: Actual page after clamping. Present only when `page` is supplied.
        totalCount:
          type: integer
          minimum: 0
          description: Total number of resources matching the filters. Present only when `page` is supplied.
        totalPages:
          type: integer
          minimum: 1
          description: Total pages, at least 1. Present only when `page` is supplied.
    PromiseListResponse:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Promise"
        pagination:
          $ref: "#/components/schemas/Pagination"
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          enum:
            - INVALID_JSON
            - VALIDATION_ERROR
            - INVALID_ID
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - RATE_LIMIT_EXCEEDED
            - INTERNAL_ERROR
            - UNSUPPORTED_MEDIA_TYPE
        message:
          type: string
          description: Human-readable error summary.
        details:
          description: Optional structured validation or diagnostic details.
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [path, code, message]
      properties:
        path:
          type: string
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
